<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Nexus AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="auth-container">
    <div class="auth-header">
      <a href="/" class="auth-brand">
        <div class="brand-icon">
          <i data-lucide="sparkles"></i>
        </div>
        <span>Nexus AI</span>
      </a>
      <h2 class="auth-title">Create an Account</h2>
      <p class="auth-subtitle">Join Nexus AI to save chat history & unlimited prompts</p>
    </div>

    <form class="auth-form" action="/register" method="POST">
      <div id="auth-alert-box"></div>
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <div class="input-wrapper">
          <i data-lucide="user" class="input-icon"></i>
          <input type="text" id="name" name="name" class="form-input" placeholder="John Doe" required autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrapper">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password" name="password" class="form-input" placeholder="e.g. Password123!" required autocomplete="new-password" oninput="checkPasswordRules()">
        </div>
      </div>

      <div class="pw-rules" id="pw-rules">
        <div class="rule-item" id="rule-len"><i data-lucide="check-circle-2"></i> At least 8 characters</div>
        <div class="rule-item" id="rule-upper"><i data-lucide="check-circle-2"></i> Starts with an UPPERCASE letter</div>
        <div class="rule-item" id="rule-num"><i data-lucide="check-circle-2"></i> Contains at least one number</div>
        <div class="rule-item" id="rule-spec"><i data-lucide="check-circle-2"></i> Contains at least one special character</div>
      </div>

      <button type="submit" class="btn-auth">Register Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login" class="auth-link">Sign In</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    function checkPasswordRules() {
      const pw = document.getElementById('password').value;

      const isLen = pw.length >= 8;
      const isUpper = pw.length > 0 && pw[0] === pw[0].toUpperCase() && pw[0] !== pw[0].toLowerCase();
      const isNum = /\d/.test(pw);
      const isSpec = /[^a-zA-Z0-9]/.test(pw);

      updateRule('rule-len', isLen);
      updateRule('rule-upper', isUpper);
      updateRule('rule-num', isNum);
      updateRule('rule-spec', isSpec);

      return isLen && isUpper && isNum && isSpec;
    }

    function updateRule(id, isValid) {
      const el = document.getElementById(id);
      if (!el) return;
      if (isValid) {
        el.classList.add('valid');
        el.classList.remove('invalid');
      } else {
        el.classList.add('invalid');
        el.classList.remove('valid');
      }
    }

    function showAuthAlert(message, type = 'error') {
      const alertBox = document.getElementById('auth-alert-box');
      if (!alertBox) return;
      const iconName = type === 'success' ? 'check-circle-2' : 'alert-circle';
      alertBox.innerHTML = `
        <div class="auth-alert ${type}">
          <div class="auth-alert-icon">
            <i data-lucide="${iconName}"></i>
          </div>
          <div class="auth-alert-content">${message}</div>
        </div>
      `;
      lucide.createIcons();
    }

    function clearAuthAlert() {
      const alertBox = document.getElementById('auth-alert-box');
      if (alertBox) alertBox.innerHTML = '';
    }

    const regForm = document.querySelector('.auth-form');
    if (regForm) {
      regForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearAuthAlert();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!name || !email || !password) {
          showAuthAlert('All fields are required.', 'error');
          return;
        }

        if (!checkPasswordRules()) {
          showAuthAlert('Please ensure your password meets all requirement rules.', 'error');
          return;
        }

        const submitBtn = regForm.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = 'Creating account...';

        try {
          const formData = new FormData(regForm);
          const response = await fetch('/register', {
            method: 'POST',
            body: formData
          });

          if (response.redirected) {
            window.location.href = '/login?registered=1';
            return;
          }

          const responseText = await response.text();

          if (response.ok && (responseText.includes('Welcome back') || responseText.includes('Sign in to your account'))) {
            window.location.href = '/login?registered=1';
            return;
          }

          let errorMsg = 'Registration failed. Please try again.';
          if (responseText.includes('User already exists')) {
            errorMsg = 'An account with this email already exists. Please sign in instead.';
          } else if (responseText.includes('All fields are required')) {
            errorMsg = 'All fields are required. Please complete the form.';
          } else if (responseText.includes('Invalid password format')) {
            errorMsg = 'Password does not meet the security requirements.';
          } else if (responseText.trim()) {
            const cleanText = responseText.replace(/<[^>]*>?/gm, '').replace(/\s+/g, ' ').trim();
            if (cleanText && !cleanText.includes('Go Back')) {
              errorMsg = cleanText;
            }
          }

          showAuthAlert(errorMsg, 'error');
        } catch (err) {
          showAuthAlert('Unable to connect to server. Please try again.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = originalBtnText;
        }
      });
    }
  </script>
</body>
</html>
