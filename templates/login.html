<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nexus AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="auth-container">
    <div class="auth-header">
      <a href="/" class="auth-brand">
        <div class="brand-icon">
          <i data-lucide="sparkles"></i>
        </div>
        <span>Nexus AI</span>
      </a>
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-subtitle">Sign in to your account to continue</p>
    </div>

    <form class="auth-form" action="/login" method="POST">
      <div id="auth-alert-box"></div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrapper">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-auth">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register" class="auth-link">Create one</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === '1' || urlParams.get('success')) {
      showAuthAlert('Account created successfully. Please log in.', 'success');
    }

    function showAuthAlert(message, type = 'error') {
      const alertBox = document.getElementById('auth-alert-box');
      if (!alertBox) return;
      const iconName = type === 'success' ? 'check-circle-2' : 'alert-circle';
      alertBox.innerHTML = `
        <div class="auth-alert ${type}">
          <div class="auth-alert-icon">
            <i data-lucide="${iconName}"></i>
          </div>
          <div class="auth-alert-content">${message}</div>
        </div>
      `;
      lucide.createIcons();
    }

    function clearAuthAlert() {
      const alertBox = document.getElementById('auth-alert-box');
      if (alertBox) alertBox.innerHTML = '';
    }

    const loginForm = document.querySelector('.auth-form');
    if (loginForm) {
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearAuthAlert();

        const submitBtn = loginForm.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = 'Signing in...';

        try {
          const formData = new FormData(loginForm);
          const response = await fetch('/login', {
            method: 'POST',
            body: formData
          });

          if (response.redirected) {
            window.location.href = response.url;
            return;
          }

          const responseText = await response.text();

          if (response.ok && (responseText.includes('Dashboard') || responseText.includes('Nexus AI - Next-Gen'))) {
            window.location.href = '/';
            return;
          }

          let errorMsg = 'Invalid email or password';
          if (responseText.includes('Invalid credentials')) {
            errorMsg = 'Invalid email or password. Please check your details.';
          } else if (responseText.trim()) {
            const cleanText = responseText.replace(/<[^>]*>?/gm, '').trim();
            if (cleanText) errorMsg = cleanText;
          }

          showAuthAlert(errorMsg, 'error');
        } catch (err) {
          showAuthAlert('Unable to connect to server. Please try again.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = originalBtnText;
        }
      });
    }
  </script>
</body>
</html>
